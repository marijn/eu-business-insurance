  /webhooks/mollie:
    post:
      tags:
        - Webhooks
      summary: Receive Mollie payment status changes
      operationId: mollieWebhook
      description: |
        Mollie posts only the payment ID. The current status is fetched from the Mollie API,
        then the payment, its refunds and the invoice (or a pending card payment method) are updated.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  example: tr_WDqYK6vllg
      responses:
        "200":
          description: Acknowledged
        "400":
          $ref: '#/components/responses/BadRequest'

  /webhooks/docusign:
    post:
      tags:
        - Webhooks
      summary: Receive DocuSign Connect envelope and recipient events
      operationId: docusignConnectWebhook
      description: |
        Configure a DocuSign Connect configuration with this URL, JSON (SIM) data format
        and HMAC signatures enabled. Handled events: recipient-completed, recipient-declined,
        envelope-completed, envelope-declined, envelope-voided; other events are acknowledged
        and ignored. Deliveries for unknown envelopes or agreements that are no longer
        awaiting signatures are acknowledged as ignored, so DocuSign does not retry them.
      security: []
      parameters:
        - name: X-DocuSign-Signature-1
          in: header
          required: true
          description: |
            Base64 HMAC-SHA256 of the raw request body with a Connect HMAC key.
            DocuSign sends one header per active key (X-DocuSign-Signature-1, -2, ...); any match is accepted.
            Not checked when the server runs with DOCUSIGN_CONNECT_SKIP_VERIFY=true (local development only).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocuSignConnectEvent'
      responses:
        "200":
          description: Event acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [processed, ignored]
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

