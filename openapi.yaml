openapi: 3.0.3

info:
  title: EU Business Insurance Platform API
  description: |
    End-to-end API for selling, managing, and servicing **Cyber Liability, D&O, Surety Bonds, and Workers' Compensation** policies in the EU.
    Compliant with **GDPR, eIDAS, PSD2, Solvency II, and IDD**.
  version: 1.0.0
  contact:
    name: API Support
    email: api@insureeu.com
  license:
    name: Proprietary
    url: https://insureeu.com/legal

servers:
  - url: https://api.insureeu.com/v1
    description: Production (EU Central - Frankfurt)
  - url: https://staging-api.insureeu.com/v1
    description: Staging (EU West - Amsterdam)

tags:
  - name: Policy Management
    description: Quote, bind, endorse, and renew policies
  - name: Agreement Engine
    description: Generate, sign, and manage legal documents
  - name: Billing & Payments
    description: Invoicing, payment processing, and dunning
  - name: Claims Management
    description: Submit, investigate, adjudicate, and pay claims
  - name: Payouts
    description: Disburse claim payments (SEPA-compliant)
  - name: Underwriting
    description: Risk assessment, pricing, and eligibility
  - name: Compliance
    description: Audit trails, GDPR, and regulatory reporting
  - name: Document Management
    description: Store and manage policy/claim documents
  - name: Webhooks
    description: Inbound notifications from integrated providers

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /quotes:
    post:
      tags:
        - Policy Management
      summary: Generate a quote for a business
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        "201":
          description: Quote created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Policy Management
      summary: List quotes
      operationId: listQuotes
      parameters:
        - $ref: '#/components/parameters/businessId'
        - $ref: '#/components/parameters/policyType'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'

  /quotes/{quote_id}:
    get:
      tags:
        - Policy Management
      summary: Retrieve a quote
      operationId: getQuote
      parameters:
        - $ref: '#/components/parameters/quoteId'
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Policy Management
      summary: Bind a quote to create a policy
      operationId: bindQuote
      parameters:
        - $ref: '#/components/parameters/quoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effective_date:
                  type: string
                  format: date
                notes:
                  type: string
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /policies:
    get:
      tags:
        - Policy Management
      summary: List policies
      operationId: listPolicies
      parameters:
        - $ref: '#/components/parameters/businessId'
        - $ref: '#/components/parameters/policyType'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: List of policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /policies/{policy_id}:
    get:
      tags:
        - Policy Management
      summary: Retrieve a policy
      operationId: getPolicy
      parameters:
        - $ref: '#/components/parameters/policyId'
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - Policy Management
      summary: Endorse (modify) a policy
      operationId: endorsePolicy
      parameters:
        - $ref: '#/components/parameters/policyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndorsementRequest'
      responses:
        "200":
          description: Policy updated with endorsement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Policy Management
      summary: Renew a policy
      operationId: renewPolicy
      parameters:
        - $ref: '#/components/parameters/policyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term:
                  $ref: '#/components/schemas/PolicyTerm'
                changes:
                  type: array
                  items:
                    $ref: '#/components/schemas/PolicyChange'
      responses:
        "200":
          description: Renewed policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Policy Management
      summary: Cancel a policy
      operationId: cancelPolicy
      parameters:
        - $ref: '#/components/parameters/policyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum: [CUSTOMER_REQUEST, NON_PAYMENT, RISK_CHANGE, FRAUD, OTHER]
                effective_date:
                  type: string
                  format: date
      responses:
        "200":
          description: Policy cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /policies/{policy_id}/coverage:
    get:
      tags:
        - Policy Management
      summary: Get active coverage details
      operationId: getCoverage
      parameters:
        - $ref: '#/components/parameters/policyId'
      responses:
        "200":
          description: Coverage details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /agreements/generate:
    post:
      tags:
        - Agreement Engine
      summary: Generate a policy/endorsement document
      operationId: generateAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementRequest'
      responses:
        "201":
          description: Agreement generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /agreements/{agreement_id}:
    get:
      tags:
        - Agreement Engine
      summary: Retrieve an agreement
      operationId: getAgreement
      parameters:
        - $ref: '#/components/parameters/agreementId'
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, html, json]
            default: json
      responses:
        "200":
          description: Agreement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /agreements/{agreement_id}/versions:
    get:
      tags:
        - Agreement Engine
      summary: List all versions of an agreement
      operationId: listAgreementVersions
      parameters:
        - $ref: '#/components/parameters/agreementId'
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgreementVersion'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /agreements/{agreement_id}/sign:
    post:
      tags:
        - Agreement Engine
      summary: Initiate e-signature (eIDAS-compliant)
      operationId: initiateSigning
      parameters:
        - $ref: '#/components/parameters/agreementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signatory_email
              properties:
                signatory_email:
                  type: string
                  format: email
                redirect_url:
                  type: string
                  format: uri
                signatory_role:
                  type: string
                  enum: [INSURED, INSURER, BROKER, WITNESS]
      responses:
        "201":
          description: Signing request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRequest'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /agreements/{agreement_id}/signatures:
    get:
      tags:
        - Agreement Engine
      summary: Get signature status
      operationId: getSignatures
      parameters:
        - $ref: '#/components/parameters/agreementId'
      responses:
        "200":
          description: Signature status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureStatus'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /agreements/{agreement_id}/void:
    post:
      tags:
        - Agreement Engine
      summary: Void an agreement (pre-signing)
      operationId: voidAgreement
      parameters:
        - $ref: '#/components/parameters/agreementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Agreement voided
        "400":
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /invoices:
    post:
      tags:
        - Billing & Payments
      summary: Generate an invoice
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Billing & Payments
      summary: List invoices
      operationId: listInvoices
      parameters:
        - $ref: '#/components/parameters/businessId'
        - $ref: '#/components/parameters/policyIdFilter'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /invoices/{invoice_id}:
    get:
      tags:
        - Billing & Payments
      summary: Retrieve an invoice
      operationId: getInvoice
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /invoices/{invoice_id}/pay:
    post:
      tags:
        - Billing & Payments
      summary: Process a payment (PSD2-compliant)
      operationId: processPayment
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        "201":
          description: Payment processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        "400":
          $ref: '#/components/responses/BadRequest'
        "402":
          description: Payment required (e.g., SCA failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /invoices/{invoice_id}/refund:
    post:
      tags:
        - Billing & Payments
      summary: Issue a refund
      operationId: refundPayment
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - reason
              properties:
                amount:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                reason:
                  type: string
                  enum: [DUPLICATE, ERROR, CANCELLATION, OTHER]
                payment_method_id:
                  type: string
      responses:
        "201":
          description: Refund initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /invoices/{invoice_id}/payments:
    get:
      tags:
        - Billing & Payments
      summary: List payments for an invoice
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /payment-methods:
    post:
      tags:
        - Billing & Payments
      summary: Add a payment method
      operationId: addPaymentMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodRequest'
      responses:
        "201":
          description: Payment method added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Billing & Payments
      summary: List payment methods
      operationId: listPaymentMethods
      parameters:
        - $ref: '#/components/parameters/businessId'
      responses:
        "200":
          description: List of payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_methods:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /dunning/{invoice_id}:
    post:
      tags:
        - Billing & Payments
      summary: Trigger dunning process
      operationId: triggerDunning
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      responses:
        "200":
          description: Dunning process started
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /claims:
    post:
      tags:
        - Claims Management
      summary: Submit a new claim
      operationId: submitClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        "201":
          description: Claim submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Claims Management
      summary: List claims
      operationId: listClaims
      parameters:
        - $ref: '#/components/parameters/businessId'
        - $ref: '#/components/parameters/policyIdFilter'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: List of claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /claims/{claim_id}:
    get:
      tags:
        - Claims Management
      summary: Retrieve a claim
      operationId: getClaim
      parameters:
        - $ref: '#/components/parameters/claimId'
      responses:
        "200":
          description: Claim details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - Claims Management
      summary: Update a claim
      operationId: updateClaim
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimUpdate'
      responses:
        "200":
          description: Claim updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /claims/{claim_id}/documents:
    post:
      tags:
        - Claims Management
      summary: Upload supporting documents
      operationId: uploadClaimDocument
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [INCIDENT_REPORT, MEDICAL_REPORT, POLICE_REPORT, INVOICE, OTHER]
                description:
                  type: string
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /claims/{claim_id}/assign:
    post:
      tags:
        - Claims Management
      summary: Assign claim to an adjuster
      operationId: assignClaim
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - adjuster_id
              properties:
                adjuster_id:
                  type: string
                notes:
                  type: string
      responses:
        "200":
          description: Claim assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /claims/{claim_id}/investigate:
    post:
      tags:
        - Claims Management
      summary: Request investigation
      operationId: requestInvestigation
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                investigator_id:
                  type: string
                scope:
                  type: array
                  items:
                    type: string
                    enum: [FRAUD, LIABILITY, COVERAGE, DAMAGE_ASSESSMENT]
                notes:
                  type: string
      responses:
        "200":
          description: Investigation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /claims/{claim_id}/adjudicate:
    post:
      tags:
        - Claims Management
      summary: Adjudicate a claim
      operationId: adjudicateClaim
      parameters:
        - $ref: '#/components/parameters/claimId'
      requestBody:
        required: true
        content:
          application/json:
