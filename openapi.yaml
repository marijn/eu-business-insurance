      summary: Retrieve the underwriting of a quote
      operationId: getQuoteUnderwriting
      parameters:
        - $ref: '#/components/parameters/quoteId'
      responses:
        "200":
          description: Underwriting of the quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteUnderwriting'
        "404":
          $ref: '#/components/responses/NotFound'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
