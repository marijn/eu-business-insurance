        "403":
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - Underwriting
      summary: Adjust the pricing, risk score, requirements or exclusions of a quote
      description: |
        Only PENDING quotes can be adjusted. Fields left out keep their current value.
        A new net_premium recalculates taxes and gross with the VAT rate of the business's
        country. The exclusions replace both coverage.exclusions and underwriting.exclusions
        of the quote, so binding the quote carries them onto the policy. Needs
        `underwriting:write`.
      operationId: updateQuoteUnderwriting
      parameters:
        - $ref: '#/components/parameters/quoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteUnderwritingUpdate'
      responses:
        "200":
          description: Underwriting of the quote after the adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteUnderwriting'
